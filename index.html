<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lazemare Nexus: Omnis V8.5</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600&display=swap');

        :root {
            --bg-pure: #050505;
            --bg-panel: #0a0a0c;
            --border-subtle: #1a1a20;
            --text-dim: #444444;
            --neon-gold: #e2c050;
            --neon-red: #ff3131;
            --neon-blue: #00f2ff;
            --neon-purple: #9d00ff;
            --neon-white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-pure);
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow-y: auto;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .title-nexus {
            font-family: 'Cinzel', serif;
            letter-spacing: 8px;
            font-size: 1.1rem;
            color: #fff;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* --- CONFIGURACIÓN OCULTA --- */
        #key-config {
            background: #111;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed var(--neon-gold);
            margin-bottom: 10px;
            display: none; /* Se muestra si no hay key */
        }

        /* --- VISIÓN --- */
        .vision-frame {
            width: 100%;
            aspect-ratio: 9/16;
            background: #000000;
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .waiting-text {
            font-family: 'Cinzel', serif;
            letter-spacing: 5px;
            font-size: 0.55rem;
            color: #222;
            text-transform: uppercase;
            position: absolute;
        }

        #result-img { width: 100%; height: 100%; object-fit: cover; display: none; z-index: 10; }

        .nav-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.8); color: var(--neon-gold);
            border: 1px solid var(--neon-gold); padding: 12px 10px;
            cursor: pointer; z-index: 30; border-radius: 6px; display: none;
        }
        .nav-arrow.left { left: 10px; } .nav-arrow.right { right: 10px; }

        .image-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 40px 10px 15px;
            background: linear-gradient(0deg, rgba(0,0,0,0.95) 20%, transparent);
            display: none; z-index: 20; gap: 6px;
        }

        /* --- PANELES --- */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 18px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-title {
            font-size: 0.5rem; color: #555; letter-spacing: 4px;
            text-transform: uppercase; text-align: center; font-weight: 600;
        }

        textarea, input {
            width: 100%; background: #020202; border: 1px solid var(--border-subtle);
            color: #fff; padding: 12px; border-radius: 8px; font-size: 0.85rem;
            resize: none; outline: none;
        }

        .grid { display: grid; gap: 8px; }
        .g2 { grid-template-columns: 1fr 1fr; }
        .g3 { grid-template-columns: repeat(3, 1fr); }
        .g4 { grid-template-columns: repeat(4, 1fr); gap: 6px; }

        .btn {
            background: transparent; color: #fff; border: 1px solid var(--border-subtle);
            padding: 10px 4px; border-radius: 6px; font-family: 'Cinzel', serif;
            font-size: 0.55rem; text-transform: uppercase; cursor: pointer;
            text-align: center; font-weight: 600; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        .btn-ritual { border-color: var(--neon-gold); color: var(--neon-gold); }
        .b-sopor { border-bottom: 2px solid var(--neon-white); }
        .b-cosmic { border-bottom: 2px solid var(--neon-blue); }
        .b-trinity { border-bottom: 2px solid var(--neon-purple); }
        .b-omnis { border-bottom: 2px solid var(--neon-gold); color: var(--neon-gold); }

        .loader-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 50;
        }
        .spinner { width: 30px; height: 30px; border: 2px solid #111; border-top: 2px solid var(--neon-gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="title-nexus" onclick="toggleConfig()">Lazemare Nexus</div>
        <div id="key-config">
            <input type="password" id="api-key-input" placeholder="Pega tu API Key aquí...">
            <button class="btn btn-ritual" style="width:100%; margin-top:5px;" onclick="saveKey()">Vincular Alma</button>
        </div>
    </header>

    <div class="vision-frame">
        <div id="loader" class="loader-overlay"><div class="spinner"></div></div>
        <div id="placeholder" class="waiting-text">Aguardando Manifestación</div>
        <img id="result-img">
        <button id="btn-prev" class="nav-arrow left" onclick="nav(-1)">&#10094;</button>
        <button id="btn-next" class="nav-arrow right" onclick="nav(1)">&#10095;</button>
        <div id="controls" class="image-overlay">
            <button class="btn" style="flex:1;">👁️ Oráculo</button>
            <button class="btn" style="flex:1;">✨ Leer</button>
            <button onclick="saveImg()" class="btn" style="flex:1; border-color:var(--neon-gold); color:var(--neon-gold);">💾 GUARDAR</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">Nexo de Intención</div>
        <textarea id="prompt-input" rows="2" placeholder="Describe la visión..."></textarea>
        <div class="grid g4">
            <button onclick="gen('SOPOR')" class="btn b-sopor">Sopor</button>
            <button onclick="gen('COSMIC')" class="btn b-cosmic">Cosmos</button>
            <button onclick="gen('MIX')" class="btn b-trinity">Trinidad</button>
            <button onclick="gen('OMNIS')" class="btn b-omnis">Omnis</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">Evolución Grotesca Infinita</div>
        <div class="grid g3">
            <button onclick="evo('Ana')" class="btn" style="color:var(--neon-red);">Profanar</button>
            <button onclick="evo('Lovecraft')" class="btn" style="color:var(--neon-blue);">Distorsionar</button>
            <button onclick="evo('Trinidad')" class="btn" style="color:var(--neon-purple);">Mutar</button>
        </div>
    </div>
</div>

<script>
    let historyData = [];
    let curIdx = -1;

    // Verificar si ya hay una llave guardada al abrir la app
    window.onload = () => {
        if(!localStorage.getItem('nexus_key')) {
            document.getElementById('key-config').style.display = 'block';
        }
    };

    function toggleConfig() {
        const cfg = document.getElementById('key-config');
        cfg.style.display = cfg.style.display === 'none' ? 'block' : 'none';
    }

    function saveKey() {
        const key = document.getElementById('api-key-input').value;
        if(key) {
            localStorage.setItem('nexus_key', key);
            document.getElementById('key-config').style.display = 'none';
            alert("Alma Vinculada.");
        }
    }

    async function gen(mode) {
        const apiKey = localStorage.getItem('nexus_key');
        if(!apiKey) { alert("Primero vincula tu API Key tocando el título."); return; }
        
        const txt = document.getElementById('prompt-input').value;
        if(!txt) return;
        
        setLoad(true);
        const prompt = `${txt}. 8k, cinematic, 9:16 aspect ratio. Dark aesthetic.`;
        
        try {
            const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                method: 'POST', body: JSON.stringify({instances:[{prompt}]})
            });
            const d = await r.json();
            if(d.predictions?.[0]?.bytesBase64Encoded) {
                historyData.push(d.predictions[0].bytesBase64Encoded);
                curIdx = historyData.length - 1;
                renderImg();
            } else {
                alert("Error: Revisa tu API Key.");
                setLoad(false);
            }
        } catch(e) { setLoad(false); }
    }

    function renderImg() {
        const img = document.getElementById('result-img');
        img.onload = () => {
            setLoad(false);
            img.style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('controls').style.display = 'flex';
            document.getElementById('btn-prev').style.display = curIdx > 0 ? 'block' : 'none';
            document.getElementById('btn-next').style.display = curIdx < historyData.length - 1 ? 'block' : 'none';
        };
        img.src = `data:image/png;base64,${historyData[curIdx]}`;
    }

    function nav(dir) { curIdx += dir; renderImg(); }
    function saveImg() {
        const a = document.createElement('a');
        a.href = `data:image/png;base64,${historyData[curIdx]}`;
        a.download = `Nexus_${Date.now()}.png`;
        a.click();
    }
    function setLoad(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }
    function evo(t) { alert("Evolución iniciada: " + t); }
</script>
</body>
</html>
